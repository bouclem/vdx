<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background: deep diagonal gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="40%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F0326"/>
    </linearGradient>
    <!-- Radial glow behind the V -->
    <radialGradient id="bgGlow" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <!-- V fill: white to lavender -->
    <linearGradient id="vFill" x1="256" y1="90" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E9DFFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- V shadow -->
    <filter id="vShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E0A3C" flood-opacity="0.7"/>
    </filter>
    <!-- Outer glow on the V -->
    <filter id="vGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Accent line gradient -->
    <linearGradient id="accentGrad" x1="256" y1="350" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGlow)"/>

  <!-- Geometric accent lines from vertex -->
  <line x1="256" y1="380" x2="180" y2="440" stroke="url(#accentGrad)" stroke-width="2"/>
  <line x1="256" y1="380" x2="332" y2="440" stroke="url(#accentGrad)" stroke-width="2"/>
  <line x1="256" y1="380" x2="256" y2="450" stroke="url(#accentGrad)" stroke-width="2.5"/>

  <!-- V shadow layer -->
  <path d="M120 110 L256 390 L392 110 L340 110 L256 310 L172 110 Z"
        fill="#1E0A3C" opacity="0.5" transform="translate(3, 5)"/>

  <!-- Main V letterform (filled, geometric) -->
  <path d="M120 110 L256 390 L392 110 L340 110 L256 310 L172 110 Z"
        fill="url(#vFill)" filter="url(#vGlow)"/>

  <!-- Thin highlight edge on left arm -->
  <path d="M120 110 L256 390"
        stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Small cursor block accent -->
  <rect x="248" y="420" width="16" height="24" rx="2" fill="#A78BFA" opacity="0.4"/>
</svg>
